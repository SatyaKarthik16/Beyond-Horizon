<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Beyond Horizon database project banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081229"/>
      <stop offset="55%" stop-color="#123b5a"/>
      <stop offset="100%" stop-color="#0f7a6c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <g opacity="0.25" fill="#ffffff">
    <circle cx="1060" cy="80" r="38"/>
    <circle cx="1120" cy="148" r="12"/>
    <circle cx="972" cy="162" r="20"/>
    <circle cx="220" cy="82" r="8"/>
    <circle cx="185" cy="128" r="5"/>
  </g>

  <g>
    <rect x="72" y="76" width="488" height="10" fill="url(#accent)" rx="5"/>
    <text x="72" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Beyond Horizon Inc.</text>
    <text x="72" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#dbeafe">End-to-End SQL Database Project</text>
    <text x="72" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#bfdbfe">Schema Design | Data Modeling | Analytics | Integrity</text>
  </g>

  <g transform="translate(860,74)">
    <rect x="0" y="0" width="340" height="212" rx="18" fill="#0b1220" opacity="0.75"/>
    <text x="24" y="42" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">SELECT mission, revenue</text>
    <text x="24" y="72" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">FROM portfolio_metrics</text>
    <text x="24" y="102" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">WHERE growth &gt; 0;</text>
    <text x="24" y="156" font-family="Consolas, monospace" font-size="16" fill="#34d399">-- SQL showcase ready</text>
  </g>
</svg>
